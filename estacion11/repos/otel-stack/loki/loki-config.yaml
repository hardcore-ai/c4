# ============================================================
# Grafana Loki — Configuración del backend de logs
#
# Loki almacena logs y los expone para consulta desde Grafana
# vía LogQL. A diferencia de Elasticsearch, Loki solo indexa
# los labels (no el contenido del log), lo que lo hace más
# liviano y económico.
# ============================================================

auth_enabled: false

server:
  http_listen_port: 3100

common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

# Límites: configuración permisiva para desarrollo
limits_config:
  reject_old_samples: true
  reject_old_samples_max_age: 168h    # 7 días
  ingestion_rate_mb: 10
  ingestion_burst_size_mb: 20
  allow_structured_metadata: true

schema_config:
  configs:
    - from: "2024-01-01"
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

# Retención de 7 días para demos
table_manager:
  retention_deletes_enabled: true
  retention_period: 168h

# Analytics deshabilitado
analytics:
  reporting_enabled: false
