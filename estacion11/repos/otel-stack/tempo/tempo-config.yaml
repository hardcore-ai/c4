# ============================================================
# Grafana Tempo — Configuración del backend de traces
#
# Tempo almacena traces distribuidos y los expone para
# consulta desde Grafana vía TraceQL.
# ============================================================

# Modo standalone: un solo proceso para todo.
# Suficiente para desarrollo y demos.
stream_over_http_enabled: true

server:
  http_listen_port: 3200

# Cómo recibe traces del Collector
distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

# Motor de ingesta: agrupa traces en bloques antes de escribir
ingester:
  max_block_duration: 5m

# Motor de compactación: optimiza el almacenamiento
compactor:
  compaction:
    block_retention: 72h    # Retención de 3 días para demos

# Almacenamiento local en disco
storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

# Generación de métricas desde traces (RED metrics)
# Tempo genera automáticamente latencia, throughput y error rate
# por servicio — disponibles en Prometheus sin instrumentación extra.
metrics_generator:
  registry:
    external_labels:
      source: tempo
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://prometheus:9090/api/v1/write
        send_exemplars: true
  traces_storage:
    path: /var/tempo/generator/traces
  processor:
    service_graphs:
      dimensions:
        - service.name
    span_metrics:
      dimensions:
        - service.name

# Configuración de overrides (límites)
overrides:
  defaults:
    metrics_generator:
      processors: [service-graphs, span-metrics]
